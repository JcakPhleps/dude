name: Dude
options:
  bundleIdPrefix: com.jackphelps
  deploymentTarget:
    macOS: "14.4"
  createIntermediateGroups: true
  defaultConfig: Debug

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""

targets:
  Dude:
    type: application
    platform: macOS
    sources:
      - path: Sources/Dude
      - path: Support/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jackphelps.dude
        PRODUCT_NAME: Dude
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Support/Info.plist
        CODE_SIGN_ENTITLEMENTS: Support/Dude.entitlements
        # Stable self-signed identity ("Dude Dev" cert in the login keychain).
        # Keeps the app's designated requirement constant across rebuilds so the
        # macOS Screen Recording grant persists — no re-granting every build.
        CODE_SIGN_IDENTITY: "Dude Dev"
        CODE_SIGN_STYLE: Manual
        # Debug builds normally split into a stub + Dude.debug.dylib; with a
        # real signing identity the two get mismatched Team IDs and dyld refuses
        # to load. Ship a single signed binary instead.
        ENABLE_DEBUG_DYLIB: "NO"
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_STRICT_CONCURRENCY: complete
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
